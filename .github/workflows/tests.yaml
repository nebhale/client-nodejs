name: Tests
"on":
  pull_request: {}
  push:
    branches:
    - main
jobs:
  unit:
    name: Unit Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'
    - name: Run Install
      run: npm ci
    - name: Run Build
      run: npm run build --if-present
    - name: Run Tests
      run: npm test
    - name: Report coverage
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage/lcov.info
        use_oidc: true
